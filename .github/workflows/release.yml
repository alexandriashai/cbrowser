name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Last-resort backstop, and it must sit ABOVE the sum of the step ceilings.
    #
    # It was 30, which was under gate(20) + release(8) + setup. That ordering is
    # the wrong way round: when a step runs long the JOB cap fires first and the
    # run is CANCELLED, which names no culprit — exactly what happened on
    # bbd2743, where it read as "the release is broken" rather than "one step
    # hung". Step timeouts are the diagnostic layer; this is only the net beneath
    # them, so it is set high enough that a step always fails first, by name.
    # (2026-07-29)
    timeout-minutes: 40
    # Skip release for commits that are just version bumps
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # npm publishes through trusted publishing (OIDC, id-token: write above), not a
      # stored token: the NPM_TOKEN secret expired on 2026-10-12 and failed the 19.3.10
      # release. Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. There is
      # deliberately no registry-url: setup-node would write an .npmrc that reads
      # NODE_AUTH_TOKEN, and npm tries a token before the OIDC exchange.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          node -e 'const [a, b] = process.versions.node.split(".").map(Number); if (a < 22 || (a === 22 && b < 14)) { console.error(`node ${process.versions.node} < 22.14.0`); process.exit(1); }'
          node -e 'const v = require("child_process").execSync("npm --version").toString().trim(); const [a, b, c] = v.split(".").map(Number); if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) { console.error(`npm ${v} < 11.5.1`); process.exit(1); } console.log(`node ${process.versions.node}, npm ${v}`);'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # THIS IS THE GATE. It was advisory until 2026-07-26 (`bun test || true` plus
      # `continue-on-error: true`) under a comment claiming "the Tests workflow is the real
      # gate". That claim was false: test.yml runs on push, release.yml is
      # workflow_dispatch and never depended on it, so nothing stopped a release on a red
      # suite — v18.72.6 reached npm while this very step reported failure.
      #
      # A hang must block too, rather than be swallowed; that was the other half of the old
      # problem. timeout-minutes bounds it, and without continue-on-error a timeout now
      # fails the release instead of quietly costing 20 minutes. 20 minutes against a
      # ~9-minute local suite leaves headroom for a slower runner without inviting a hang.
      - name: Run tests (release gate)
        run: bun run test:gate
        timeout-minutes: 20

      # The quarantined browser tests deliberately do NOT run here.
      #
      # They had an advisory step in this job for exactly one release attempt,
      # which taught the lesson: `continue-on-error` covers a step that FAILS, not
      # a step that HANGS. The quarantined set hung its full 10-minute timeout,
      # the job then hit the runner's 30-minute ceiling, and the release was
      # cancelled — so an "advisory, does not block" step blocked the release.
      #
      # Visibility was the reason for putting it here, and visibility is already
      # covered: the Tests workflow runs `bun test --coverage` over the FULL suite
      # on every push to main, browser tests included. Running them twice bought
      # nothing and cost the release. (2026-07-27)

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # BOUNDED, because this step is where an unbounded hook can hide.
      #
      # release-it runs its own `before:init` hooks from .release-it.json, and
      # those run INSIDE this step — outside the careful timeout accounting
      # above. That is not hypothetical: `before:init` used to include
      # `bun test || true`, a THIRD test invocation which
      #   - ran the full suite in ONE process, the exact configuration
      #     scripts/test-split.sh exists to avoid,
      #   - was unbounded, so no step timeout applied to it, and
      #   - discarded its own result via `|| true`, so it could never prevent a
      #     bad release — only cost time.
      # On 2026-07-29 (bbd2743) the gate step passed and THIS step then ate the
      # remaining budget until the job hit the 30-minute ceiling and was
      # CANCELLED. A cancelled job is worse than a failed one: it names no
      # culprit, and it looked like the release itself was broken.
      #
      # The hook is now `bun run build` only. The timeout below is the structural
      # half of the fix: whatever a future hook does, a hang fails THIS step by
      # name in a few minutes instead of silently consuming the job. release-it's
      # real work — bump, changelog, commit, tag, push, npm publish, GitHub
      # release — is minutes at most. (2026-07-29)
      - name: Release (dry run)
        if: github.event.inputs.dry_run == 'true'
        timeout-minutes: 8
        run: npx release-it --ci --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: github.event.inputs.dry_run != 'true'
        timeout-minutes: 8
        run: npx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN: a set token makes npm skip the OIDC exchange.
