name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # `bun run test` is scripts/test-split.sh, NOT `bun test`.
      #
      # This step used to run `bun test --coverage`: the whole suite in ONE
      # process. That is precisely the configuration test-split.sh was written to
      # avoid — browser-launching files accumulate something across a long-lived
      # `bun test` process until a launch hangs, and WHICH test times out is
      # random. release.yml's own comments call this out ("the exact
      # configuration scripts/test-split.sh exists to avoid") while this workflow
      # kept doing it.
      #
      # The split runs MORE than the release gate, not less: test-gate.sh
      # excludes the quarantined browser files, test-split.sh runs every file and
      # merely isolates the browser-heavy ones into their own processes. So this
      # is both the most complete run and the most stable one.
      #
      # Coverage is dropped rather than moved to its own step. Nothing consumed
      # it — no upload, no threshold, no gate — and release.yml records the
      # lesson that an "advisory" step which HANGS still blocks the job, so a
      # second full test invocation is a cost with no reader. `bun run
      # test:coverage` still exists for local use.
      # DIAGNOSTIC, non-blocking. Runs the one file quarantined from the split
      # (see QUARANTINED_ON_CI in scripts/test-split.sh), purely to capture WHERE
      # it hangs on CI. Invoked directly rather than through the split runner, so
      # the quarantine does not apply here.
      #
      # Runs BEFORE the gating step, on a cold runner, so the reading is not
      # contaminated by whatever the full suite leaves behind.
      #
      # The capture helper announces each stage BEFORE awaiting it, so the last
      # `[capture] ->` line without a matching `OK` names the stage that never
      # returned. Two prior CI runs reported nothing but "timed out after
      # 180000ms" because everything was logged after the fact and died with the
      # test.
      #
      # continue-on-error alone is not enough — release.yml records that an
      # advisory step which HANGS still blocks the job — so it is bounded by
      # timeout-minutes as well. Per-stage bounds cap this at roughly 4 minutes.
      #
      # DELETE THIS STEP once the hang is understood. It is an investigation,
      # not a permanent part of the pipeline.
      - name: Diagnostic — locate the capture hang (non-blocking)
        run: bun test tests/recording-change-tiers.test.ts
        continue-on-error: true
        timeout-minutes: 10

      - name: Run tests
        run: bun run test
        # This workflow had no timeout at all. release.yml learned that a hang
        # must fail by name rather than eat the runner ceiling and be cancelled;
        # the same applies here. ~9 minutes locally, so 25 leaves headroom for a
        # slower runner without inviting an unbounded hang.
        timeout-minutes: 25

      - name: Type check
        run: bun run build

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=150

  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify LICENSE immutable fields unchanged
        run: |
          # The project uses the standard MIT license (adopted deliberately); these
          # fields must NEVER change without an explicit relicensing decision.

          if ! grep -q "MIT License" LICENSE; then
            echo "❌ ERROR: LICENSE is no longer the MIT License!"
            exit 1
          fi

          if ! grep -q "Copyright (c) 2026 Alexandria Eden" LICENSE; then
            echo "❌ ERROR: copyright holder line has been modified!"
            echo "Must remain: 'Copyright (c) 2026 Alexandria Eden'"
            exit 1
          fi

          echo "✅ LICENSE immutable fields are correct"
          echo "   - MIT License"
          echo "   - Copyright (c) 2026 Alexandria Eden"
