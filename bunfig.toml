# second time at GC, which can shut a live browser's CDP pipe or a Bun.spawn
# child's pidfd. The preload keeps those children reachable. See
# tests/fixtures/extra-stdio-guard.ts and tests/bun-extra-stdio-late-close.test.ts.
[test]
preload = ["./tests/fixtures/extra-stdio-guard.ts"]
