<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page metrics fixture: abjad nav labels beside one paragraph</title>
<link rel="stylesheet" href="page-metrics-format2.css">
</head>
<body>
<!-- Four two-word Arabic labels (8 abjad words) in a nav, and a paragraph
     of 9 Arabic words: the page reads as abjad. -->
<nav aria-label="الرئيسية">
<ul>
<li><a href="/a">الصفحة الرئيسية</a></li>
<li><a href="/b">خدماتنا الحالية</a></li>
<li><a href="/c">الأسئلة الشائعة</a></li>
<li><a href="/d">اتصل بنا</a></li>
</ul>
</nav>
<main>
<p>هذه فقرة عربية قصيرة تحتوي على تسع كلمات فقط.</p>
</main>
</body>
</html>
