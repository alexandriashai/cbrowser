<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page metrics fixture: grouped links that are all icons</title>
<link rel="stylesheet" href="page-metrics-format2.css">
</head>
<body>
<!-- A nav of 3 icon-only links: groupedLinksWithText 0 of groupedLinks 3. -->
<nav class="link-row" aria-label="Tools">
<a href="/search"><svg role="img" aria-label="Search" width="20" height="20" viewBox="0 0 20 20"><rect width="20" height="20" fill="#369"/></svg></a>
<a href="/share" aria-label="Share"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect width="20" height="20" fill="#369"/></svg></a>
<a href="/menu"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect width="20" height="20" fill="#369"/></svg><span class="sr-only">Menu</span></a>
</nav>
<p>A page whose only navigation is three icons, with this paragraph beside it.</p>
</body>
</html>
