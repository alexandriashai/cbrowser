<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page metrics fixture: nav labels beside one paragraph</title>
<link rel="stylesheet" href="page-metrics-format2.css">
</head>
<body>
<!-- A nav of 8 two-word labels (16 words) beside one paragraph of 12 words.
     proseInNav is the labels; prose minus proseInNav is the paragraph. -->
<nav aria-label="Main">
<ul>
<li><a href="/n0">Our products</a></li>
<li><a href="/n1">Our solutions</a></li>
<li><a href="/n2">Pricing plans</a></li>
<li><a href="/n3">Customer stories</a></li>
<li><a href="/n4">Developer docs</a></li>
<li><a href="/n5">Company news</a></li>
<li><a href="/n6">Careers here</a></li>
<li><a href="/n7">Contact sales</a></li>
</ul>
</nav>
<main>
<p>One paragraph of ordinary reading text with exactly twelve words in it.</p>
</main>
</body>
</html>
