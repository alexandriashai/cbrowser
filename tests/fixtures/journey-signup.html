<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account</title><link rel="stylesheet" href="journey.css"></head>
<body class="page-short">
<main>
  <h1 class="box h1">Create your account</h1>
  <p class="box p1">It takes less than a minute.</p>
  <form action="journey-welcome.html" method="get">
    <label class="box label label-1" for="email">Email</label>
    <input class="box field" id="email" name="email" type="email" placeholder="you@example.com">
    <label class="box label label-2" for="password">Password</label>
    <input class="box field-2" id="password" name="password" type="password">
    <label class="box label label-3" for="plan">Plan</label>
    <select class="box field-3" id="plan" name="plan"><option>Starter</option><option>Team</option></select>
  </form>
  <a class="box submit" id="create" href="journey-welcome.html">Create account</a>
</main>
</body>
</html>
